<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Refri</title>
</head>
<body>
  <main>
    <div class="item ativo" style="--background: #ea3d41">
      <div class="titulo">Morango</div>
      <img class="fruta" src="./img/Morango-refrigerante-foregroundBlur.png" alt="Refri de Morango com desfoque">
      <img class="refri" src="./img/Morango-refrigerante.png" alt="Refri de Morango">
    </div>
    <div class="item" style="--background: #2d5643">
      <div class="titulo">Abacate</div>
      <img class="fruta" src="./img/Abacate-refrigerante-foregroundBlur.png" alt="Refri de Abacate com desfoque">
      <img class="refri" src="./img/Abacate-refrigerante.png" alt="Refri de Abacate">
    </div>
    <div class="item oculto" style="--background: #e7a043">
      <div class="titulo">Laranja</div>
      <img class="fruta" src="./img/Laranja-refrigerante-foregroundBlur.png" alt="Refri de Laranja com desfoque">
      <img class="refri" src="./img/Laranja-refrigerante.png" alt="Refri de Laranja">
    </div>
    <div class="seta">
      <button id="prev"> &lt; </button>
      <button id="next"> &gt; </button>
    </div>
  </main>
</body>
</html>
